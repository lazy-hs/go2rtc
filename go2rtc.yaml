# 工程配置。视频流配置请放在当前系统对应的 go2rtc_* 文件中。
log:
  level: info
  onvif: debug

api:
  # ONVIF 协议以及 Web UI 监听地址
  listen: :2985
  config: false

onvif:
  name: "模拟摄像机"
  manufacturer: Lazy
  model: "Virtual IPC-9000"
  serial: "CAM-001"
  hardware: "Virtual IPC"

rtsp:
  listen: :9554

webrtc:
  listen: ":9555"

app:
  # 只启用必要模块
  modules:
    - "api"
    - "http"
    - "rtsp"
    - "onvif"
    - "exec"
    - "ffmpeg"
    - "ws"
    - "webrtc"
    - "mp4"
    - "hls"
    - "mjpeg"

event:
  enabled: true
  interval: 1m
  burst: 5
  permanent: true
  templates:
    - enabled: true
      name: 烟雾火焰
      topic: tns1:RuleEngine/FlameDetector
      startData: <tt:SimpleItem Value="true" Name="IsMotion"/>
      endData: <tt:SimpleItem Value="false" Name="IsMotion"/>
      startOperation: Changed
      endOperation: Deleted
    - enabled: true
      name: 区域闯入
      topic: tns1:RuleEngine/FieldDetector/ObjectsInside
      startData: <tt:SimpleItem Value="true" Name="IsMotion"/>
      endData: <tt:SimpleItem Value="false" Name="IsMotion"/>
      startOperation: Changed
      endOperation: Deleted
    - enabled: true
      name: 越线
      topic: tns1:RuleEngine/LineDetector/Crossed
      startData: <tt:SimpleItem Value="true" Name="IsMotion"/>
      endData: <tt:SimpleItem Value="false" Name="IsMotion"/>
      startOperation: Changed
      endOperation: Deleted
    - enabled: true
      name: 区域离开
      topic: tns1:RuleEngine/FieldDetector/Outside
      startData: <tt:SimpleItem Value="true" Name="IsMotion"/>
      endData: <tt:SimpleItem Value="false" Name="IsMotion"/>
      startOperation: Changed
      endOperation: Deleted
    - enabled: true
      name: 物品丢失
      topic: tns1:RuleEngine/RemovedObjectDetector
      startData: <tt:SimpleItem Value="true" Name="IsMotion"/>
      endData: <tt:SimpleItem Value="false" Name="IsMotion"/>
      startOperation: Changed
      endOperation: Deleted
