# go2rtc.yml
ffmpeg:
  file: "-re -stream_loop -1 -i {input}"
log:
  level: info
  onvif: debug

streams:
  # main:
  # - ffmpeg:device?video=0&video_size=1280x720&framerate=30#video=h264
  main:
    - ffmpeg:D:/huangsheng/测试视频/2026.06.21-第12期下-4K.高码率.mp4#video=h264#input=file#audio=aac
  package:
    - ffmpeg:D:/huangsheng/监控中心/竞品分析/萤石/视频素材/包裹检测/标准纸箱-1米-2.mp4#video=h264#input=file#audio=aac
  cam1:
    - ffmpeg:/Users/lazy/huangsheng/资源/video/cross/route_01_室外1_P1P2双人四摄_先后通行_从cam4到cam3到cam1到cam2/cam1/cam01_route01_take01.mp4#video=h264#input=file#audio=aac
  cam2:
    - ffmpeg:/Users/lazy/huangsheng/资源/video/cross/route_01_室外1_P1P2双人四摄_先后通行_从cam4到cam3到cam1到cam2/cam2/cam02_route01_take01.mp4#video=h264#input=file
  cam3:
    - ffmpeg:/Users/lazy/huangsheng/资源/video/cross/route_01_室外1_P1P2双人四摄_先后通行_从cam4到cam3到cam1到cam2/cam3/cam03_route01_take02.mp4#video=h264#input=file
  cam4:
    - ffmpeg:/Users/lazy/huangsheng/资源/video/cross/route_01_室外1_P1P2双人四摄_先后通行_从cam4到cam3到cam1到cam2/cam4/cam04_route01_take02.mp4#video=h264#input=file
api:
  # ONVIF 协议以及 Web UI 监听地址
  listen: ":2984"

onvif:
  name: "模拟摄像机"
  manufacturer: Lazy
  model: "Virtual IPC-9000"
  serial: "CAM-001"
  hardware: "Virtual IPC"
rtsp:
  listen: ":9554"

webrtc:
  listen: ":9555"

app:
  # 只启用必要模块
  modules:
    - "api"
    - "http"
    - "rtsp"
    - "onvif"
    - "exec"
    - "ffmpeg"
    - "ws"
    - "webrtc"
    - "mp4"
    - "hls"
    - "mjpeg"

event:
  enabled: true
  interval: 5s
  burst: 10
  permanent: true
  templates:
    - enabled: true
      name: 镜头遮挡
      topic: tns1:VideoSource/GlobalSceneChange
      startData: <tt:SimpleItem Value="true" Name="IsMotion"/>
      endData: <tt:SimpleItem Value="false" Name="IsMotion"/>
      startOperation: Changed
      endOperation: Deleted
simulate:
  ptz_enabled: false
  ptz:
    main:
      max_zoom: 4
      pan_speed: 0.6
      tilt_speed: 0.6
      zoom_speed: 0.5
  onvif_qualities:
    main:
      - width: 0
        height: 0
    package:
      - width: 0
        height: 0
    cam1:
      - width: 0
        height: 0
    cam2:
      - width: 0
        height: 0
    cam3:
      - width: 0
        height: 0
    cam4:
      - width: 0
        height: 0
  disabled_streams:
    - main
    - package
  onvif_enabled: true
  streams_enabled: true
  rtsp_enabled: true
