# go2rtc.yml
ffmpeg:
  file: "-re -stream_loop -1 -i {input}"
log:
  level: info
  onvif: debug

streams:
  # main:
  # - ffmpeg:device?video=0&video_size=1280x720&framerate=30#video=h264
  main:
    - ffmpeg:D:/huangsheng/测试视频/2026.06.21-第12期下-4K.高码率.mp4#video=h264#input=file#audio=aac
  car:
  - ffmpeg:C:/Users/8054/Videos/监控中心二期算法测试数据/监控中心二期算法测试数据/人脸/光线充足/car.mp4#video=h264#audio=aac#input=file
  package:
    - ffmpeg:D:/huangsheng/监控中心/竞品分析/萤石/视频素材/包裹检测/标准纸箱-1米-2.mp4#video=h264#input=file#audio=aac
  normal:
  - ffmpeg:C:/Users/8054/Videos/监控中心二期算法测试数据/监控中心二期算法测试数据/宠物/宠物监控录像/normal_video.mp4#video=h264#audio=aac#input=file
  person1:
    - ffmpeg:D:/huangsheng/project/go2rtc/static/F-001_正脸后侧脸_1.5米高1米远_光线充足.MP4#video=h264#input=file
  person2:
    - ffmpeg:D:/huangsheng/project/go2rtc/static/F-001_正脸后侧脸_1.5米高3米远_光线充足.MP4#video=h264#input=file
  dog:
    - ffmpeg:D:/huangsheng/project/go2rtc/static/go2_4k_cn_fps30_8192k.mp4#video=h264#input=file
  main2:
    - ffmpeg:D:/huangsheng/测试视频/2026.06.28-第1期下-4K.高码率.mp4#video=h264#input=file
api:
  # ONVIF 协议以及 Web UI 监听地址
  listen: ":2984"

onvif:
  name: "模拟摄像机"
  manufacturer: Lazy
  model: "Virtual IPC-9000"
  serial: "CAM-001"
  hardware: "Virtual IPC"
rtsp:
  listen: ":9554"

webrtc:
  listen: ":9555"

app:
  # 只启用必要模块
  modules:
    - "api"
    - "http"
    - "rtsp"
    - "onvif"
    - "exec"
    - "ffmpeg"
    - "ws"
    - "webrtc"
    - "mp4"
    - "hls"
    - "mjpeg"

event:
  enabled: true
  interval: 5s
  burst: 10
  permanent: true
  templates:
    - enabled: true
      name: 镜头遮挡
      topic: tns1:VideoSource/GlobalSceneChange
      startData: <tt:SimpleItem Value="true" Name="IsMotion"/>
      endData: <tt:SimpleItem Value="false" Name="IsMotion"/>
      startOperation: Changed
      endOperation: Deleted
simulate:
  ptz_enabled: false
  ptz:
    main:
      max_zoom: 4
      pan_speed: 0.6
      tilt_speed: 0.6
      zoom_speed: 0.5
  onvif_qualities:
    main:
      - width: 0
        height: 0
    dog:
      - width: 0
        height: 0
    package:
      - width: 0
        height: 0
    main2:
      - width: 0
        height: 0
  disabled_streams:
    - car
    - dog
    - main
    - main2
    - normal
    - package
    - person1
    - person2
  onvif_enabled: true
  streams_enabled: true
  rtsp_enabled: true
