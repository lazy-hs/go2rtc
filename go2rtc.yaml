  file: "-re -stream_loop -1 -i {input}"
log:
  level: info
  onvif: debug

streams:
  # main:
  # - ffmpeg:device?video=0&video_size=1280x720&framerate=30#video=h264
  main:
    - ffmpeg:C:/Users/8054/Videos/2026.06.21-第12期下-4K.高码率.mp4#video=h264#width=1920#height=1080#input=file#audio=aac
  car:
  - ffmpeg:C:/Users/8054/Videos/监控中心二期算法测试数据/监控中心二期算法测试数据/人脸/光线充足/car.mp4#video=h264#audio=aac#input=file
  package:
  - ffmpeg:C:/Users/8054/Videos/监控中心二期算法测试数据/监控中心二期算法测试数据/包裹/光线充足/包裹被取走消失.mp4#video=h264#audio=aac#input=file
  normal:
  - ffmpeg:C:/Users/8054/Videos/监控中心二期算法测试数据/监控中心二期算法测试数据/宠物/宠物监控录像/normal_video.mp4#video=h264#audio=aac#input=file
  people:
  - ffmpeg:C:/Users/8054/Videos/监控中心二期算法测试数据/监控中心二期算法测试数据/未分类/盘点监控下的倒霉人类.mp4#video=h264#audio=aac#input=file
  animal:
  - ffmpeg:C:/Users/8054/Videos/监控中心二期算法测试数据/监控中心二期算法测试数据/宠物/光线充足/小狗照镜子.mp4#video=h264#audio=aac#input=file
