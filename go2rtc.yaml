    - ffmpeg:D:/huangsheng/project/go2rtc/static/F-001_正脸后侧脸_1.5米高1米远_光线充足.MP4#video=h264#input=file
  person2:
    - ffmpeg:D:/huangsheng/project/go2rtc/static/F-001_正脸后侧脸_1.5米高3米远_光线充足.MP4#video=h264#input=file
api:
  # ONVIF 协议以及 Web UI 监听地址
  listen: ":2984"

onvif:
  name: "模拟摄像机"
  manufacturer: "HuangSheng"
  model: "Virtual IPC-9000"
  firmware: "2.1.0"
  serial: "CAM-001"
  hardware: "Virtual IPC"
rtsp:
  listen: ":9554"

webrtc:
  listen: ":9555"

app:
  # 只启用必要模块
  modules:
    - "api"
    - "http"
    - "rtsp"
    - "onvif"
    - "exec"
    - "ffmpeg"
    - "ws"
    - "webrtc"
    - "mp4"
    - "hls"
    - "mjpeg"

event:
  enabled: true
  interval: 10s
  burst: 10
  permanent: true
  templates:
    - enabled: true
      name: 烟雾火焰
      topic: "tns1:RuleEngine/FlameDetector"
      startData: '<tt:SimpleItem Value="true" Name="IsMotion"/>'
      endData: '<tt:SimpleItem Value="false" Name="IsMotion"/>'
      startOperation: Changed
      endOperation: Deleted
    - enabled: true
      name: 区域闯入
      topic: "tns1:RuleEngine/FieldDetector/ObjectsInside"
      startData: '<tt:SimpleItem Value="true" Name="IsMotion"/>'
      endData: '<tt:SimpleItem Value="false" Name="IsMotion"/>'
      startOperation: Changed
      endOperation: Deleted
    - enabled: true
      name: 越线
      topic: "tns1:RuleEngine/LineDetector/Crossed"
      startData: '<tt:SimpleItem Value="true" Name="IsMotion"/>'
      endData: '<tt:SimpleItem Value="false" Name="IsMotion"/>'
      startOperation: Changed
      endOperation: Deleted
    - enabled: true
      name: 区域离开
      topic: "tns1:RuleEngine/FieldDetector/Outside"
      startData: '<tt:SimpleItem Value="true" Name="IsMotion"/>'
      endData: '<tt:SimpleItem Value="false" Name="IsMotion"/>'
      startOperation: Changed
      endOperation: Deleted
    - enabled: true
      name: 物品丢失
      topic: "tns1:RuleEngine/RemovedObjectDetector"
      startData: '<tt:SimpleItem Value="true" Name="IsMotion"/>'
      endData: '<tt:SimpleItem Value="false" Name="IsMotion"/>'
      startOperation: Changed
      endOperation: Deleted
    - enabled: true
      name: 人脸检测
      topic: "tns1:RuleEngine/FaceDetector"
      startData: '<tt:SimpleItem Value="true" Name="IsMotion"/>'
      endData: '<tt:SimpleItem Value="false" Name="IsMotion"/>'
      startOperation: Changed
      endOperation: Deleted
    - enabled: true
      name: 画面变化
      topic: "tns1:VideoSource/MotionAlarm"
      startData: '<tt:SimpleItem Value="true" Name="IsMotion"/>'
      endData: '<tt:SimpleItem Value="false" Name="IsMotion"/>'
      startOperation: Changed
      endOperation: Deleted
    - enabled: true
      name: 人形检测
      topic: "tns1:RuleEngine/MyRuleDetector/PeopleDetect"
      startData: '<tt:SimpleItem Value="true" Name="IsMotion"/>'
      endData: '<tt:SimpleItem Value="false" Name="IsMotion"/>'
      startOperation: Changed
      endOperation: Deleted
    - enabled: true
      name: 车辆检测
      topic: "tns1:RuleEngine/MyRuleDetector/VehicleDetect"
      startData: '<tt:SimpleItem Value="true" Name="IsMotion"/>'
      endData: '<tt:SimpleItem Value="false" Name="IsMotion"/>'
      startOperation: Changed
      endOperation: Deleted
    - enabled: true
      name: 包裹检测
      topic: "tns1:RuleEngine/PackageDetector"
      startData: '<tt:SimpleItem Value="true" Name="IsMotion"/>'
      endData: '<tt:SimpleItem Value="false" Name="IsMotion"/>'
      startOperation: Changed
      endOperation: Deleted
    - enabled: true
      name: 设备故障
      topic: "tns1:Device/HardwareFailure"
      startData: '<tt:SimpleItem Value="true" Name="IsMotion"/>'
      endData: '<tt:SimpleItem Value="false" Name="IsMotion"/>'
      startOperation: Changed
      endOperation: Deleted
    - enabled: true
      name: 镜头遮挡
      topic: "tns1:VideoSource/GlobalSceneChange"
      startData: '<tt:SimpleItem Value="true" Name="IsMotion"/>'
      endData: '<tt:SimpleItem Value="false" Name="IsMotion"/>'
      startOperation: Changed
      endOperation: Deleted
    - enabled: true
      name: 设备移动
      topic: "tns1:RuleEngine/MyRuleDetector/ShockDetection"
      startData: '<tt:SimpleItem Value="true" Name="IsMotion"/>'
      endData: '<tt:SimpleItem Value="false" Name="IsMotion"/>'
      startOperation: Changed
      endOperation: Deleted
simulate:
  ptz_enabled: false
  ptz:
    main:
      max_zoom: 4
      pan_speed: 0.6
      tilt_speed: 0.6
      zoom_speed: 0.5
  onvif_qualities:
    main:
      - width: 0
        height: 0
      - width: 0
        height: 1080
  disabled_streams:
    - animal
    - car
    - normal
    - package
    - people
    - person1
    - person2
