api:
  # ONVIF 协议以及 Web UI 监听地址
  listen: ":2984"

onvif:
  name: "仓库模拟摄像机"
  manufacturer: "HuangSheng"
  model: "Virtual IPC-9000"
  firmware: "2.1.0"
  serial: "CAM-001"
  hardware: "Virtual IPC"
rtsp:
  listen: ":9554"

webrtc:
  listen: ":9555"

app:
  # 只启用必要模块
  modules:
    - "api"
    - "http"
    - "rtsp"
    - "onvif"
    - "exec"
    - "ffmpeg"
    - "ws"
    - "webrtc"
    - "mp4"
    - "hls"
    - "mjpeg"

event:
  # 事件产生时间间隔
  interval: "1m"
  # 永久保留 ONVIF 事件订阅，忽略客户端的短期过期时间
  permanent: true
  # 初始事件数
  burst: 10
  # 事件模板，每次上报随机选择一条
  templates:
    # #画面变化
    # - topic: "tns1:VideoSource/MotionAlarm"
    #   sourceData: '<tt:SimpleItem Value="analytics_video_source_audio_source" Name="VideoAnalyticsConfigurationToken"/><tt:SimpleItem Value="MyMotionDetectorRule" Name="Rule"/>'
    #   startData: '<tt:SimpleItem Value="true" Name="IsMotion"/>'
    #   endData: '<tt:SimpleItem Value="false" Name="IsMotion"/>'
    #   startOperation: "Changed"
    #   endOperation: "Deleted"
    # #包裹检测
    # - topic: "tns1:RuleEngine/PackageDetector"
    #   sourceData: '<tt:SimpleItem Value="analytics_video_source_audio_source" Name="VideoAnalyticsConfigurationToken"/><tt:SimpleItem Value="MyMotionDetectorRule" Name="Rule"/>'
    #   startData: '<tt:SimpleItem Value="true" Name="IsMotion"/>'
    #   endData: '<tt:SimpleItem Value="false" Name="IsMotion"/>'
    #   startOperation: "Changed"
    #   endOperation: "Deleted"

    # #车辆检测
    # - topic: "tns1:RuleEngine/MyRuleDetector/VehicleDetect"
    #   sourceData: '<tt:SimpleItem Value="analytics_video_source_audio_source" Name="VideoAnalyticsConfigurationToken"/><tt:SimpleItem Value="MyMotionDetectorRule" Name="Rule"/>'
    #   startData: '<tt:SimpleItem Value="true" Name="IsMotion"/>'
    #   endData: '<tt:SimpleItem Value="false" Name="IsMotion"/>'
    #   startOperation: "Changed"
    #   endOperation: "Deleted"
    #火焰检测
    - topic: "tns1:RuleEngine/FlameDetector"
      sourceData: '<tt:SimpleItem Value="analytics_video_source_audio_source" Name="VideoAnalyticsConfigurationToken"/><tt:SimpleItem Value="MyMotionDetectorRule" Name="Rule"/>'
      startData: '<tt:SimpleItem Value="true" Name="IsMotion"/>'
      endData: '<tt:SimpleItem Value="false" Name="IsMotion"/>'
      startOperation: "Changed"
      endOperation: "Deleted"
  # #区域闯入 (FieldIntrusion)
  #   - topic: "tns1:RuleEngine/FieldDetector/ObjectsInside"
  #     startData: '<tt:SimpleItem Value="true" Name="IsMotion"/>'
  #     endData: '<tt:SimpleItem Value="false" Name="IsMotion"/>'

  #   #越线 (LineCrossing)
  #   - topic: "tns1:RuleEngine/LineDetector/Crossed"
