api:
  # ONVIF 协议以及 Web UI 监听地址
  listen: ":2984"

onvif:
  name: "模拟摄像机"
  manufacturer: "HuangSheng"
  model: "Virtual IPC-9000"
  firmware: "2.1.0"
  serial: "CAM-001"
  hardware: "Virtual IPC"
rtsp:
  listen: ":9554"

webrtc:
  listen: ":9555"

app:
  # 只启用必要模块
  modules:
    - "api"
    - "http"
    - "rtsp"
    - "onvif"
    - "exec"
    - "ffmpeg"
    - "ws"
    - "webrtc"
    - "mp4"
    - "hls"
    - "mjpeg"

event:
  enabled: true
  interval: 1m
  burst: 10
  permanent: true
  templates:
    - enabled: true
      name: 画面变化
      topic: tns1:VideoSource/MotionAlarm
      sourceData: <tt:SimpleItem Value="analytics_video_source_audio_source" Name="VideoAnalyticsConfigurationToken"/><tt:SimpleItem Value="MyMotionDetectorRule" Name="Rule"/>
      startData: <tt:SimpleItem Value="true" Name="IsMotion"/>
      endData: <tt:SimpleItem Value="false" Name="IsMotion"/>
      startOperation: Changed
      endOperation: Deleted
    - enabled: true
      name: 包裹检测
      topic: tns1:RuleEngine/PackageDetector
      sourceData: <tt:SimpleItem Value="analytics_video_source_audio_source" Name="VideoAnalyticsConfigurationToken"/><tt:SimpleItem Value="MyMotionDetectorRule" Name="Rule"/>
      startData: <tt:SimpleItem Value="true" Name="IsMotion"/>
      endData: <tt:SimpleItem Value="false" Name="IsMotion"/>
      startOperation: Changed
      endOperation: Deleted
    - enabled: true
      name: '#车辆检测'
      topic: tns1:RuleEngine/MyRuleDetector/VehicleDetect
      sourceData: <tt:SimpleItem Value="analytics_video_source_audio_source" Name="VideoAnalyticsConfigurationToken"/><tt:SimpleItem Value="MyMotionDetectorRule" Name="Rule"/>
      startData: <tt:SimpleItem Value="true" Name="IsMotion"/>
      endData: <tt:SimpleItem Value="false" Name="IsMotion"/>
      startOperation: Changed
      endOperation: Deleted
    - enabled: true
      name: 火焰检测
      topic: tns1:RuleEngine/FlameDetector
      sourceData: <tt:SimpleItem Value="analytics_video_source_audio_source" Name="VideoAnalyticsConfigurationToken"/><tt:SimpleItem Value="MyMotionDetectorRule" Name="Rule"/>
      startData: <tt:SimpleItem Value="true" Name="IsMotion"/>
      endData: <tt:SimpleItem Value="false" Name="IsMotion"/>
      startOperation: Changed
      endOperation: Deleted
    - enabled: true
      name: 区域闯入
      topic: tns1:RuleEngine/FieldDetector/ObjectsInside
      startData: <tt:SimpleItem Value="true" Name="IsMotion"/>
      endData: <tt:SimpleItem Value="false" Name="IsMotion"/>
    - enabled: true
      name: 越线 (LineCrossing)
      topic: tns1:RuleEngine/LineDetector/Crossed
      startData: <tt:SimpleItem Value="true" Name="IsMotion"/>
      endData: <tt:SimpleItem Value="false" Name="IsMotion"/>
    - enabled: true
      name: 区域离开 (FieldExit)
      topic: tns1:RuleEngine/FieldDetector/Outside
      startData: <tt:SimpleItem Value="true" Name="IsMotion"/>
      endData: <tt:SimpleItem Value="false" Name="IsMotion"/>
    - enabled: false
      name: 咳嗽声
      topic: tns1:RuleEngine/AudioAnalytics/Cough
      startData: <tt:SimpleItem Value="true" Name="IsMotion"/>
      endData: <tt:SimpleItem Value="false" Name="IsMotion"/>
      startOperation: Changed
      endOperation: Deleted
    - enabled: false
      name: 哭声
      topic: tns1:RuleEngine/AudioAnalytics/Cry
      startData: <tt:SimpleItem Value="true" Name="IsMotion"/>
      endData: <tt:SimpleItem Value="false" Name="IsMotion"/>
      startOperation: Changed
      endOperation: Deleted
simulate:
  onvif_qualities:
    main:
      - width: 0
        height: 0
      - width: 0
        height: 360
      - width: 0
        height: 480
      - width: 0
        height: 720
      - width: 0
        height: 1080
      - width: 0
        height: 1440
      - width: 0
        height: 2048
  disabled_streams:
    - animal
    - car
    - normal
    - package
    - people
    - person1
    - person2
