<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go2RTC控制台</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script src="https://cdn.jsdelivr.net/npm/vis-network@10.0.2/standalone/umd/vis-network.min.js"></script>
    <style>
        html, body, #network-shell {
            height: 100%;
        }

        #network-shell {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 14px 18px 18px;
        }

        #network {
            position: relative;
            flex: 1 1 auto;
            min-height: 440px;
            overflow: hidden;
            border: 1px solid rgba(34, 50, 77, 0.92);
            border-radius: 18px;
            background:
                linear-gradient(rgba(34, 50, 77, 0.16) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 50, 77, 0.16) 1px, transparent 1px),
                rgba(2, 6, 23, 0.34);
            background-size: 32px 32px;
            box-shadow: 0 20px 50px rgba(2, 6, 23, 0.24);
            height: 100%;
        }

        #network::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(90deg, rgba(2, 6, 23, 0.62), transparent 18%, transparent 82%, rgba(2, 6, 23, 0.62)),
                linear-gradient(180deg, rgba(2, 6, 23, 0.48), transparent 20%, transparent 84%, rgba(2, 6, 23, 0.46));
        }

        #network-canvas {
            position: absolute;
            inset: 0;
        }

        .network-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
            padding: 12px 14px;
            border: 1px solid rgba(34, 50, 77, 0.92);
            border-radius: 16px;
            background: rgba(17, 24, 39, 0.72);
            box-shadow: 0 12px 32px rgba(2, 6, 23, 0.18);
        }

        .network-heading {
            display: grid;
            gap: 3px;
        }

        .network-heading strong {
            color: #e2e8f0;
            font-size: 16px;
            letter-spacing: .01em;
        }

        .network-heading span {
            color: #94a3b8;
            font-size: 12px;
        }

        .network-stats,
        .network-legend,
        .network-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .network-stat,
        .network-legend-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #cbd5e1;
            font-size: 12px;
            white-space: nowrap;
        }

        .network-stat b {
            color: #f8fafc;
            font-size: 14px;
            font-variant-numeric: tabular-nums;
        }

        .network-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.08);
        }

        .network-dot.host { background: #60a5fa; }
        .network-dot.producer { background: #f97316; }
        .network-dot.consumer { background: #34d399; }
        .network-dot.node { background: #fbbf24; }
        .network-dot.traffic { background: #a78bfa; }
        .network-dot.rate { background: #f472b6; }

        .network-action {
            min-height: 32px;
            padding: 6px 10px;
            border: 1px solid rgba(43, 63, 99, 0.95);
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.76);
            color: #cbd5e1;
            font: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .network-action:hover {
            border-color: rgba(34, 211, 238, 0.44);
            color: #a5f3fc;
        }

        .network-status {
            position: absolute;
            right: 14px;
            bottom: 12px;
            padding: 5px 8px;
            border: 1px solid rgba(34, 211, 238, 0.16);
            border-radius: 999px;
            background: rgba(2, 6, 23, 0.72);
            color: #94a3b8;
            font-size: 11px;
            pointer-events: none;
            z-index: 3;
        }

        .network-status.is-error {
            border-color: rgba(251, 113, 133, 0.34);
            color: #fda4af;
        }

        .network-empty-state {
            position: absolute;
            inset: 50% auto auto 50%;
            width: min(420px, calc(100% - 32px));
            padding: 24px 28px;
            display: grid;
            gap: 8px;
            border: 1px solid rgba(34, 211, 238, 0.2);
            border-radius: 16px;
            background: rgba(17, 24, 39, 0.94);
            box-shadow: 0 20px 50px rgba(2, 6, 23, 0.3);
            text-align: center;
            transform: translate(-50%, -50%);
            z-index: 4;
        }

        .network-empty-state[hidden] {
            display: none;
        }

        .network-empty-state strong {
            color: #e2e8f0;
            font-size: 16px;
        }

        .network-empty-state span {
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.6;
        }

        .network-detail {
            position: absolute;
            left: 18px;
            bottom: 18px;
            z-index: 5;
            width: min(520px, calc(100% - 36px));
            max-height: min(52vh, 360px);
            display: grid;
            gap: 10px;
            padding: 14px;
            border: 1px solid rgba(34, 211, 238, 0.22);
            border-radius: 16px;
            background: rgba(8, 13, 25, 0.94);
            box-shadow: 0 24px 60px rgba(2, 6, 23, 0.38);
            backdrop-filter: blur(14px);
            transform: translateY(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity .16s ease, transform .16s ease;
        }

        .network-detail.is-visible {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .network-detail strong {
            color: #f8fafc;
            font-size: 13px;
            line-height: 1.35;
        }

        .network-detail pre {
            max-height: 260px;
            margin: 0;
            padding: 11px 12px;
            border: 1px solid rgba(34, 50, 77, 0.78);
            border-radius: 12px;
            background: rgba(2, 6, 23, 0.72);
            color: #cbd5e1;
            font-size: 12px;
            line-height: 1.55;
            white-space: pre-wrap;
            overflow: auto;
            overflow-wrap: anywhere;
        }

        @media (max-width: 720px) {
            #network-shell {
                padding: 10px 12px 12px;
            }

            .network-toolbar {
                align-items: flex-start;
            }

            .network-stats {
                order: 3;
                width: 100%;
                padding-top: 2px;
                border-top: 1px solid rgba(34, 50, 77, 0.7);
            }

            #network {
                min-height: 420px;
            }

            .network-detail {
                left: 10px;
                right: 10px;
                bottom: 10px;
                width: auto;
                max-height: 44vh;
            }
        }
    </style>
</head>
<body>

<script src="main.js"></script>

<div id="network-shell">
    <section class="network-toolbar" aria-label="网络链路概览">
        <div class="network-heading">
            <strong>网络链路</strong>
            <span id="network-scope">全部流 · 每 5 秒自动刷新</span>
        </div>
        <div class="network-stats" aria-live="polite">
            <span class="network-stat"><i class="network-dot host"></i>主机 <b id="stat-host">0</b></span>
            <span class="network-stat"><i class="network-dot producer"></i>生产者 <b id="stat-producer">0</b></span>
            <span class="network-stat"><i class="network-dot consumer"></i>消费者 <b id="stat-consumer">0</b></span>
            <span class="network-stat"><i class="network-dot node"></i>编解码 <b id="stat-node">0</b></span>
            <span class="network-stat" title="服务端向外发送的累计流量"><i class="network-dot traffic"></i>总流量 <b id="stat-traffic">0 B</b></span>
            <span class="network-stat" title="按最近两次刷新间隔计算的平均速率"><i class="network-dot rate"></i>瞬时流量 <b id="stat-rate">0 B/s</b></span>
        </div>
        <div class="network-actions">
            <button class="network-action" id="network-fit" type="button">整理视图</button>
        </div>
    </section>
    <div id="network">
        <div id="network-canvas"></div>
        <aside id="network-detail" class="network-detail" aria-live="polite" aria-hidden="true">
            <strong id="network-detail-title">连接详情</strong>
            <pre id="network-detail-body"></pre>
        </aside>
        <span class="network-status" id="network-status" role="status" aria-live="polite">正在连接…</span>
        <div id="network-empty-state" class="network-empty-state" role="status" aria-live="polite" hidden>
            <strong>暂无消费者拉流</strong>
            <span>当前没有客户端正在拉取视频流，开始播放或连接流后，网络关系将在这里显示。</span>
        </div>
    </div>
</div>

<script>
    /* global vis */
    window.addEventListener('load', () => {
        const url = new URL('api/streams.dot' + location.search, location.href);

        const container = document.getElementById('network-canvas');
        const emptyState = document.getElementById('network-empty-state');
        const detail = document.getElementById('network-detail');
        const detailTitle = document.getElementById('network-detail-title');
        const detailBody = document.getElementById('network-detail-body');
        const status = document.getElementById('network-status');
        const fitButton = document.getElementById('network-fit');
        const scope = document.getElementById('network-scope');
        const stat = {
            host: document.getElementById('stat-host'),
            producer: document.getElementById('stat-producer'),
            consumer: document.getElementById('stat-consumer'),
            node: document.getElementById('stat-node'),
            traffic: document.getElementById('stat-traffic'),
            rate: document.getElementById('stat-rate'),
        };

        const srcFilters = new URLSearchParams(location.search).getAll('src');
        if (srcFilters.length) {
            scope.textContent = `${srcFilters.join('、')} · 每 5 秒自动刷新`;
        }

        const compactLayout = window.matchMedia('(max-width: 720px)').matches;
        // /api/streams.dot already describes the data flow; this view only
        // assigns stable visual roles and lays the directed graph out by level.
        const options = {
            autoResize: true,
            layout: {
                hierarchical: {
                    enabled: true,
                    direction: compactLayout ? 'UD' : 'LR',
                    sortMethod: 'directed',
                    levelSeparation: compactLayout ? 120 : 220,
                    nodeSpacing: compactLayout ? 95 : 130,
                    treeSpacing: compactLayout ? 150 : 280,
                    blockShifting: true,
                    edgeMinimization: true,
                    parentCentralization: true,
                },
            },
            edges: {
                arrows: {to: {enabled: true, scaleFactor: 0.7}},
                color: {color: 'rgba(148, 163, 184, 0.72)', highlight: '#67e8f9'},
                font: {
                    align: 'middle',
                    color: '#cbd5e1',
                    face: 'Consolas, JetBrains Mono, monospace',
                    size: 11,
                    strokeWidth: 3,
                    strokeColor: '#020617',
                },
                smooth: {enabled: true, type: 'cubicBezier', forceDirection: compactLayout ? 'vertical' : 'horizontal', roundness: 0.28},
                width: 1.5,
                selectionWidth: 2.4,
            },
            groups: {
                host: {
                    shape: 'box',
                    color: {background: '#60a5fa', border: '#bfdbfe', highlight: {background: '#93c5fd', border: '#dbeafe'}},
                    font: {color: '#0f172a', size: 13, face: 'Consolas, JetBrains Mono, monospace', bold: true},
                    margin: 10,
                    widthConstraint: {maximum: 190},
                },
                producer: {
                    shape: 'box',
                    color: {background: '#f97316', border: '#fed7aa', highlight: {background: '#fb923c', border: '#ffedd5'}},
                    font: {color: '#431407', size: 12, face: 'Consolas, JetBrains Mono, monospace', bold: true},
                    margin: 9,
                    widthConstraint: {maximum: 180},
                },
                consumer: {
                    shape: 'box',
                    color: {background: '#34d399', border: '#a7f3d0', highlight: {background: '#6ee7b7', border: '#d1fae5'}},
                    font: {color: '#022c22', size: 12, face: 'Consolas, JetBrains Mono, monospace', bold: true},
                    margin: 9,
                    widthConstraint: {maximum: 180},
                },
                node: {
                    shape: 'box',
                    color: {background: '#fbbf24', border: '#fef3c7', highlight: {background: '#fcd34d', border: '#fffbeb'}},
                    font: {color: '#422006', size: 12, face: 'Consolas, JetBrains Mono, monospace', bold: true},
                    margin: 8,
                    widthConstraint: {maximum: 150},
                },
            },
            nodes: {
                borderWidth: 1,
                shape: 'box',
                shadow: {enabled: true, color: 'rgba(2, 6, 23, 0.32)', size: 8, x: 0, y: 3},
                chosen: {node: true, label: false},
            },
            interaction: {
                hover: true,
                tooltipDelay: 999999,
            },
            physics: false,
        };

        let network;
        let previousTraffic = null;
        let previousTrafficAt = 0;
        const trafficStorageKey = `go2rtc.network.traffic:${location.pathname}${location.search}`;

        try {
            const savedTraffic = JSON.parse(sessionStorage.getItem(trafficStorageKey) || 'null');
            if (Number.isFinite(savedTraffic?.bytes) && Number.isFinite(savedTraffic?.at)) {
                previousTraffic = savedTraffic.bytes;
                previousTrafficAt = savedTraffic.at;
            }
        } catch (error) {
            // Storage can be unavailable in privacy-restricted browser contexts.
        }

        function getItems(collection) {
            return Array.isArray(collection) ? collection : collection?.get?.() || [];
        }

        function formatBytes(value) {
            let bytes = Number(value);
            if (!Number.isFinite(bytes) || bytes <= 0) return '0 B';

            const units = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
            let unit = 0;
            while (bytes >= 1000 && unit < units.length - 1) {
                bytes /= 1000;
                unit++;
            }
            return unit === 0 ? `${Math.floor(bytes)} B` : `${bytes.toFixed(2)} ${units[unit]}`;
        }

        function updateStats(data, totalTraffic) {
            const counts = {host: 0, producer: 0, consumer: 0, node: 0};
            for (const item of getItems(data.nodes)) {
                if (Object.prototype.hasOwnProperty.call(counts, item.group)) counts[item.group]++;
            }
            for (const key of Object.keys(counts)) stat[key].textContent = counts[key];

            const traffic = Number(totalTraffic);
            const now = Date.now();
            let rate = 0;
            if (Number.isFinite(traffic)) {
                if (previousTraffic !== null && traffic >= previousTraffic && now > previousTrafficAt) {
                    rate = (traffic - previousTraffic) / ((now - previousTrafficAt) / 1000);
                }
                previousTraffic = traffic;
                previousTrafficAt = now;
                try {
                    sessionStorage.setItem(trafficStorageKey, JSON.stringify({bytes: traffic, at: now}));
                } catch (error) {
                    // Storage can be unavailable in privacy-restricted browser contexts.
                }
            } else {
                previousTraffic = null;
                previousTrafficAt = 0;
            }

            stat.traffic.textContent = formatBytes(traffic);
            stat.rate.textContent = `${formatBytes(rate)}/s`;
            emptyState.hidden = counts.consumer > 0;
            return counts;
        }

        function cleanDetailText(value) {
            const text = String(value || '').replace(/<br\s*\/?>/gi, '\n').replace(/<\/?[^>]+>/g, '');
            const textarea = document.createElement('textarea');
            textarea.innerHTML = text;
            return textarea.value.trim();
        }

        function prepareDetails(data) {
            for (const item of getItems(data.nodes)) {
                if (!item.title) continue;
                item._detail = cleanDetailText(item.title);
                item.title = '';
            }
            for (const item of getItems(data.edges)) {
                if (!item.title) continue;
                item._detail = cleanDetailText(item.title);
                item.title = '';
            }
        }

        function parseNetworkData(dotData) {
            if (/^digraph\s*\{\s*\}$/i.test(dotData.trim())) {
                return {nodes: [], edges: []};
            }
            return vis.parseDOTNetwork(dotData);
        }

        function normalizeLayoutLevels(data) {
            const nodes = getItems(data.nodes);
            const edges = getItems(data.edges);
            const localIds = new Set(
                nodes
                    .filter(node => node.group === 'host' && node.label === '本地进程')
                    .map(node => String(node.id))
            );

            if (!localIds.size) return;

            const outgoing = new Map();
            const incomingCount = new Map(nodes.map(node => [String(node.id), 0]));
            for (const edge of edges) {
                const from = String(edge.from);
                const to = String(edge.to);
                if (!outgoing.has(from)) outgoing.set(from, []);
                outgoing.get(from).push(to);
                incomingCount.set(to, (incomingCount.get(to) || 0) + 1);
            }

            const levelById = new Map();
            const queue = [];
            for (const id of localIds) {
                levelById.set(id, 0);
                queue.push(id);
            }

            for (let index = 0; index < queue.length; index++) {
                const id = queue[index];
                const nextLevel = (levelById.get(id) || 0) + 1;
                for (const nextId of outgoing.get(id) || []) {
                    if (localIds.has(nextId) || levelById.has(nextId)) continue;
                    levelById.set(nextId, nextLevel);
                    queue.push(nextId);
                }
            }

            const roots = nodes
                .map(node => String(node.id))
                .filter(id => !localIds.has(id) && (incomingCount.get(id) || 0) === 0);
            for (const id of roots) {
                if (!levelById.has(id)) levelById.set(id, 1);
            }

            for (const node of nodes) {
                const id = String(node.id);
                if (localIds.has(id)) {
                    node.level = 0;
                } else {
                    node.level = Math.max(1, levelById.get(id) ?? 1);
                }
            }
        }

        function findItem(dataSet, id) {
            return dataSet?.get?.(id) || getItems(dataSet).find(item => item.id === id);
        }

        function showDetail(title, text) {
            if (!text) return hideDetail();
            detailTitle.textContent = title;
            detailBody.textContent = text;
            detail.classList.add('is-visible');
            detail.setAttribute('aria-hidden', 'false');
        }

        function hideDetail() {
            detail.classList.remove('is-visible');
            detail.setAttribute('aria-hidden', 'true');
        }

        async function update() {
            try {
                const response = await fetch(url, {cache: 'no-cache'});
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const dotData = await response.text();
                const data = parseNetworkData(dotData);
                prepareDetails(data);
                normalizeLayoutLevels(data);
                const counts = updateStats(data, response.headers.get('X-Go2RTC-Total-Traffic-Bytes'));
                status.textContent = counts.consumer ? `已更新 · ${new Date().toLocaleTimeString()}` : '等待客户端连接';
                status.classList.remove('is-error');

                if (!network) {
                    network = new vis.Network(container, data, options);
                    network.once('afterDrawing', () => network.fit({animation: false}));
                    network.on('hoverNode', event => {
                        const node = findItem(network.body.data.nodes, event.node);
                        showDetail(node?.label || '节点详情', node?._detail);
                    });
                    network.on('hoverEdge', event => {
                        const edge = findItem(network.body.data.edges, event.edge);
                        showDetail(edge?.label || '连接详情', edge?._detail);
                    });
                    network.on('blurNode', hideDetail);
                    network.on('blurEdge', hideDetail);
                    network.on('dragStart', hideDetail);
                    network.on('zoom', hideDetail);
                } else {
                    const positions = network.getPositions();
                    const viewPosition = network.getViewPosition();
                    const scale = network.getScale();
                    const selectedNodes = network.getSelectedNodes();

                    network.setData(data);

                    for (const nodeId in positions) {
                        network.moveNode(nodeId, positions[nodeId].x, positions[nodeId].y);
                    }

                    network.moveTo({position: viewPosition, scale: scale});

                    network.selectNodes(selectedNodes);
                }
            } catch (error) {
                console.error('Error fetching or updating network data:', error);
                status.textContent = '网络数据获取失败';
                status.classList.add('is-error');
            }

            setTimeout(update, 5000);
        }

        fitButton.addEventListener('click', () => {
            if (network) network.fit({animation: {duration: 450, easingFunction: 'easeInOutQuad'}});
        });

        update();
    });
</script>

</body>
</html>
