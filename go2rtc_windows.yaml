# Windows 视频流配置
ffmpeg:
  file: "-re -stream_loop -1 -i {input}"

streams:
  main:
    - 'ffmpeg:D:/huangsheng/测试视频/2026.06.28-第1期下-4K.高码率.mp4#video=h264#input=file#audio=copy'
  main2:
    - 'ffmpeg:D:/huangsheng/测试视频/2026.06.21-第12期下-4K.高码率.mp4#video=h264#input=file#audio=copy'
  qaz:
    - 'ffmpeg:device?video=0&video_size=1920x1080&framerate=30#video=h264'
  jiumen:
    - ffmpeg:D:/huangsheng/资源/hsheng/videos/jiumen/27-4K.高码率.mp4#video=copy#input=file#audio=aac/16000
  car:
    - ffmpeg:D:/huangsheng/资源/hsheng/videos/监控中心二期算法测试数据/人脸/光线充足/car.mp4#video=h264#input=file
  jiumen2:
    - ffmpeg:D:/huangsheng/资源/hsheng/videos/jiumen/28-4K.高码率.mp4#video=copy#input=file#audio=aac/16000
  jiumen3:
    - ffmpeg:D:/huangsheng/资源/hsheng/videos/jiumen/29-4K.高码率.mp4#video=copy#input=file#audio=aac/16000

simulate:
  ptz_enabled: false
  ptz:
    main:
      max_zoom: 4
      pan_speed: 0.6
      tilt_speed: 0.6
      zoom_speed: 0.5
  onvif_qualities:
    main:
      - width: 0
        height: 0
    main2:
      - width: 0
        height: 0
    qaz:
      - width: 0
        height: 0
    jiumen:
      - width: 0
        height: 0
    car:
      - width: 0
        height: 0
    jiumen2:
      - width: 0
        height: 0
    jiumen3:
      - width: 0
        height: 0
  disabled_streams:
    - car
    - jiumen
    - jiumen2
    - jiumen3
    - main2
    - qaz
  onvif_enabled: true
  streams_enabled: true
  rtsp_enabled: true
